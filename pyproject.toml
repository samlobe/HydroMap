[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromap"
version = "0.2.0"
description = "Deterministic HydroMap workflow runner"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.26,<2",
  "pandas",
  "joblib",
  "tqdm",
  "MDAnalysis>=2.10,<2.11",
  "openmm>=8.2,<8.3",
]

[project.scripts]
hydromap = "hydromap.cli:main"

[tool.setuptools.packages.find]
include = ["hydromap*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
