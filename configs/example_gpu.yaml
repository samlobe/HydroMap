# HydroMap example: standard GPU workflow
#
# Copy this file, put your PDB in inputs/, then change protein below.
# For more options, see example_advanced.yaml.

# Looks for inputs/example_tiny_protein.pdb.
input_dir: ../inputs

protein: example_tiny_protein

# Optional: change this, or use `seeds: [1, 2, 3]` for replicate runs.
seed: 42

md:
  # Increase for production runs.
  nanoseconds: 0.5

  # Optional positional restraint for selected atoms (using MDAnalysis selection language). Common choices:
  # restrain_selection: "protein and name CA"
  # restrain_selection: "backbone"

# Optional: choose which colored PDB files to write.
# Defaults to PC1, PC2, PC3, Fdewet, and water_potential.
# analysis:
#   color_properties: [Fdewet, PC1, PC2, PC3]
